{% extends "base.html" %}
{% block title %}Excluir categoria{% endblock %}
{% block content %}
<div id="content"><div class="container">
<h2>Excluir categoria</h2>
<div class="alert alert-warning">Tem certeza que deseja excluir <strong>{{ categoria.Categoria }}</strong>? {{ quantidade_produtos }} produto(s) usam esta categoria.</div>
<form method="POST">{% csrf_token %}
<button class="btn btn-danger" type="submit">Excluir</button>
<a href="{% url 'categorias' %}" class="btn btn-secondary">Cancelar</a>
</form>
</div></div>
{% endblock %}
