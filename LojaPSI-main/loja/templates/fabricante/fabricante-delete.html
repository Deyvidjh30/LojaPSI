{% extends "base.html" %}
{% block title %}Excluir fabricante{% endblock %}
{% block content %}
<div id="content"><div class="container">
<h2>Excluir fabricante</h2>
<div class="alert alert-warning">Tem certeza que deseja excluir <strong>{{ fabricante.fabricante }}</strong>? {{ quantidade_produtos }} produto(s) usam este fabricante.</div>
<form method="POST">{% csrf_token %}
<button class="btn btn-danger" type="submit">Excluir</button>
<a href="{% url 'fabricantes' %}" class="btn btn-secondary">Cancelar</a>
</form>
</div></div>
{% endblock %}
